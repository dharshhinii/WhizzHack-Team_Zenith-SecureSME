services:
  app:
    build: .
    container_name: cyber-tools-demo
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - LANG=en
    command: ["uvicorn", "app:app", "--host", "0.0.0.0", "--port", "8000"]
    # Uncomment the next lines if you want to persist generated reports on the host
    # volumes:
    #   - ./reports:/app/reports
